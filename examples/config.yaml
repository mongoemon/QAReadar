# ตัวอย่าง YAML สำหรับแปลงเป็น JSON
service:
  name: coffee-api
  port: 8080
  debug: false
  owner: null

database:
  host: localhost
  port: 5432
  pool:
    min: 2
    max: 10

features:
  - search
  - orders
  - name: loyalty
    enabled: true
    tiers: [bronze, silver, gold]

limits:
  requestsPerMinute: 120
  ratio: 0.75
